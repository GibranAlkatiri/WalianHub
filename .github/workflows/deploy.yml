# Membangun website dan memasangnya ke GitHub Pages setiap ada push ke branch main.
# Bisa juga dijalankan manual dari tab Actions → "Build dan deploy" → Run workflow.
name: Build dan deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Pasang paket
        run: bun install --frozen-lockfile
      - name: Periksa aturan konten dan Wisata
        run: bun test
      - name: Bangun website
        run: bun run build
      - name: Simpan hasil build untuk GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pasang ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
