<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Gambar default Website Kelurahan Walian: ilustrasi perbukitan dan matahari, tanpa teks. -->
  <defs>
    <linearGradient id="langit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6EA"/>
      <stop offset="0.55" stop-color="#FBF1C2"/>
      <stop offset="1" stop-color="#F6DDA0"/>
    </linearGradient>
    <radialGradient id="cahaya" cx="1000" cy="340" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#E8A33D" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kabut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9F9F1" stop-opacity="0"/>
      <stop offset="1" stop-color="#F9F9F1" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#langit)"/>
  <circle cx="1000" cy="340" r="430" fill="url(#cahaya)"/>
  <circle cx="1000" cy="340" r="90" fill="#E8A33D"/>
  <!-- Pegunungan jauh dengan dua puncak gunung api -->
  <path fill="#A8BD85" d="M0 560 L150 520 L300 480 L420 430 L540 360 L640 300 L700 282 L760 300 L860 360 L980 430 L1080 455 L1180 420 L1260 395 L1300 388 L1340 395 L1440 440 L1600 480 V900 H0 Z"/>
  <rect y="420" width="1600" height="330" fill="url(#kabut)"/>
  <!-- Bukit tengah -->
  <path fill="#708564" d="M0 650 C160 590 320 600 480 620 C660 642 800 560 980 570 C1160 580 1300 630 1460 600 C1520 590 1570 585 1600 590 V900 H0 Z"/>
  <!-- Bukit dekat -->
  <path fill="#45742F" d="M0 740 C220 680 420 700 640 725 C860 750 1040 680 1260 690 C1400 696 1520 715 1600 725 V900 H0 Z"/>
  <!-- Tanah depan -->
  <path fill="#2F4F22" d="M0 830 C260 790 520 800 800 820 C1080 840 1340 800 1600 805 V900 H0 Z"/>
</svg>
